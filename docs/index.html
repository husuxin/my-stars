    star._hay = [
      star.full_name, star.description, star.language, star.note, star.category,
      (star.topics || []).join(" ")
    ].join(" ").toLowerCase();
  });

  $("#stat-count").textContent = Number(data.count || stars.length).toLocaleString();
  $("#stat-stars").textContent = formatStars(stars.reduce(function (sum, s) { return sum + (s.stars || 0); }, 0));
  $("#stat-langs").textContent = Object.keys(langCounts).length;
  $("#stat-cats").textContent = categories.length;

  function addChip(label, value) {
    var button = document.createElement("button");
    button.type = "button";
    button.className = "chip" + (value === "all" ? " active" : "");
    button.dataset.cat = value;
    button.textContent = label;
    chips.appendChild(button);
  }
  addChip("全部 " + stars.length, "all");
  categories.forEach(function (category) {
    addChip(category.heading + " " + category.count, category.heading);
  });

  Object.keys(langCounts)
    .sort(function (a, b) { return langCounts[b] - langCounts[a] || a.localeCompare(b); })
    .forEach(function (name) {
      var option = document.createElement("option");
      option.value = name;
      option.textContent = name + " (" + langCounts[name] + ")";
      language.appendChild(option);
    });

  // Restore state from the URL so a filtered view can be bookmarked.
  var params = new URLSearchParams(window.location.search);
  if (params.get("q")) state.q = params.get("q");
  if (params.get("cat")) state.cat = params.get("cat");
  if (params.get("lang")) state.lang = params.get("lang");
  if (params.get("sort")) state.sort = params.get("sort");
  if (params.get("notes") === "1") state.notes = true;

  var catExists = Array.prototype.some.call(chips.querySelectorAll(".chip"), function (chip) {
    return chip.dataset.cat === state.cat;
  });
  if (!catExists) state.cat = "all";
  var langExists = Array.prototype.some.call(language.options, function (option) {
    return option.value === state.lang;
  });
  if (!langExists) state.lang = "all";
  if (["stars", "recent", "name"].indexOf(state.sort) === -1) state.sort = "stars";

  search.value = state.q;
  language.value = state.lang;
  sort.value = state.sort;
  notesOnly.checked = state.notes;
  chips.querySelectorAll(".chip").forEach(function (chip) {
    chip.classList.toggle("active", chip.dataset.cat === state.cat);
  });

  function syncURL() {
    var next = new URLSearchParams();
    if (state.q) next.set("q", state.q);
    if (state.cat !== "all") next.set("cat", state.cat);
    if (state.lang !== "all") next.set("lang", state.lang);
    if (state.sort !== "stars") next.set("sort", state.sort);
    if (state.notes) next.set("notes", "1");
    var query = next.toString();
    window.history.replaceState(null, "", query ? "?" + query : window.location.pathname);
  }

  function card(star) {
    var topics = (star.topics || []).slice(0, 5);
    var color = LANG_COLORS[star.language] || "#8b8b8b";
    return '<article class="card">' +
      '<div class="card-top">' +
        '<a class="repo" href="' + escapeHTML(star.url) + '" target="_blank" rel="noopener">' +
          escapeHTML(star.full_name) +
        '</a>' +
        '<div class="tags">' +
          (star.category ? '<span class="cat" title="分类">' + escapeHTML(star.category) + '</span>' : '') +
          (star.archived ? '<span class="badge">已归档</span>' : '') +
        '</div>' +
      '</div>' +
      (star.description
        ? '<p class="desc">' + escapeHTML(star.description) + '</p>'
        : '<p class="desc">暂无描述</p>') +
      (star.note ? '<p class="note">📝 ' + escapeHTML(star.note) + '</p>' : '') +
      (topics.length
        ? '<div class="topics">' + topics.map(function (topic) {
            return '<span>' + escapeHTML(topic) + '</span>';
          }).join("") + '</div>'
        : '') +
      '<div class="card-foot">' +
        (star.language
          ? '<span class="lang"><i class="dot" style="background:' + color + '"></i><span>' +
            escapeHTML(star.language) + '</span></span>'
          : '<span class="lang">—</span>') +
        '<span class="stars" title="GitHub stars">★ ' + formatStars(star.stars) + '</span>' +
        (star.starred_at
          ? '<span class="when" title="收藏时间">' + escapeHTML(star.starred_at.slice(0, 10)) + '</span>'
          : '') +
      '</div>' +
    '</article>';
  }

  function apply() {
    var tokens = state.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    var list = stars.filter(function (star) {
      if (state.cat !== "all" && star.category !== state.cat) return false;
      if (state.lang !== "all" && star.language !== state.lang) return false;
      if (state.notes && !star.note) return false;
      return tokens.every(function (token) { return star._hay.indexOf(token) !== -1; });
    });

    if (state.sort === "stars") {
      list.sort(function (a, b) { return (b.stars || 0) - (a.stars || 0); });
    } else if (state.sort === "recent") {
      list.sort(function (a, b) { return String(b.starred_at || "").localeCompare(String(a.starred_at || "")); });
    } else {
      list.sort(function (a, b) { return a.full_name.toLowerCase().localeCompare(b.full_name.toLowerCase()); });
    }

    var html = [];
    for (var i = 0; i < list.length; i++) html.push(card(list[i]));
    grid.innerHTML = html.join("");
    empty.hidden = list.length > 0;
    resultCount.textContent = "显示 " + list.length + " / " + stars.length + " 个项目";
  }

  var timer = null;
  search.addEventListener("input", function () {
    window.clearTimeout(timer);
    timer = window.setTimeout(function () {
      state.q = search.value;
      syncURL();
      apply();
    }, 110);
  });

  chips.addEventListener("click", function (event) {
    var chip = event.target.closest(".chip");
    if (!chip) return;
    state.cat = chip.dataset.cat;
    chips.querySelectorAll(".chip").forEach(function (item) {
      item.classList.toggle("active", item === chip);
    });
    syncURL();
    apply();
  });

  language.addEventListener("change", function () {
    state.lang = language.value;
    syncURL();
    apply();
  });

  sort.addEventListener("change", function () {
    state.sort = sort.value;
    syncURL();
    apply();
  });

  notesOnly.addEventListener("change", function () {
    state.notes = notesOnly.checked;
    syncURL();
    apply();
  });

  document.addEventListener("keydown", function (event) {
    var tag = (document.activeElement && document.activeElement.tagName) || "";
    if (event.key === "/" && tag !== "INPUT" && tag !== "SELECT" && tag !== "TEXTAREA") {
      event.preventDefault();
      search.focus();
    }
    if (event.key === "Escape" && document.activeElement === search) {
      search.value = "";
      state.q = "";
      syncURL();
      apply();
      search.blur();
    }
  });

  apply();
})();
</script>
</body>
</html>
